# --------------------------------------------------------------------------
# nginx reverse proxy for shakespeare2 — plain HTTP on :80.
#
# Use this file for:
#   * localhost / dev
#   * ALB / CloudFront / any setup where TLS terminates upstream
#
# For direct-TLS deploys (nginx + Let's Encrypt on this host), use the
# docker-compose.prod.yml overlay, which swaps in `nginx.prod.conf`
# generated from `nginx.prod.conf.template`. See docker-compose.prod.yml
# header or `make deploy-tls` for the setup sequence.
# --------------------------------------------------------------------------

events {
    worker_connections 1024;
}

http {
    # MIME types + sensible defaults.
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;
    server_tokens off;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;

    # gzip text assets (the app's responses are small; this mainly helps static).
    gzip              on;
    gzip_vary         on;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript
                      application/json image/svg+xml;

    # Rate limits — applied at the server block below.
    # 10 req/s per client IP for the app as a whole; burst of 20 for the
    # "click generate a few times in a row" UX. WebSocket upgrade goes through
    # the generic zone; once upgraded, no further HTTP requests are counted.
    limit_req_zone  $binary_remote_addr  zone=app:10m  rate=10r/s;
    limit_req_status 429;

    upstream app {
        server app:8080;
    }

    # Cap request bodies — this app doesn't accept large uploads.
    client_max_body_size   16k;
    client_body_timeout    15s;
    client_header_timeout  10s;

    # --- HTTP server -------------------------------------------------------
    server {
        listen      80 default_server;
        listen      [::]:80 default_server;
        server_name _;

        # Container-to-container healthcheck; don't log, don't rate-limit.
        location = /healthz {
            access_log off;
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Admin endpoints are not reachable through the public proxy. The
        # intended operator path is `docker exec app` → direct call to
        # 127.0.0.1:8080. Defence-in-depth on top of the X-Admin-Token
        # check in the app itself.
        location /admin {
            return 404;
        }

        # Default location — rate-limited, static + dynamic + WebSocket.
        location / {
            limit_req           zone=app  burst=20  nodelay;

            proxy_pass          http://app;
            proxy_http_version  1.1;

            # WebSocket upgrade
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Stream bytes through as they arrive (no buffering).
            proxy_buffering    off;

            # Long read timeout — poem generation can be slow on modest hw.
            proxy_read_timeout 600s;
            proxy_send_timeout 120s;

            # Security headers on every response. HSTS is commented out for
            # the plain-HTTP default; enable it once TLS is in place.
            # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff"         always;
            add_header X-Frame-Options        "DENY"            always;
            add_header Referrer-Policy        "no-referrer"     always;
            add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
            add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        }
    }
}
