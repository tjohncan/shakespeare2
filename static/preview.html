<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'">
    <title>__APP_TITLE__</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon/favicon-64x64.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
    <link rel="manifest" href="/favicon/site.webmanifest">
    <script src="/preview.js" defer></script>
</head>
<body class="preview">
    <main>
        <h1>__APP_TITLE__</h1>
        <p class="subtitle">__APP_TAGLINE__</p>
        <form id="form" autocomplete="off">
            <input id="prompt" type="text" placeholder="a sonnet about the sea at dawn..." disabled>
            <button type="submit" disabled>generate</button>
        </form>
        __BACKLINK__
    </main>

    <dialog id="login-modal" aria-label="log in">
        <a href="/login" class="modal-primary">log in</a>
        __BACKLINK__
    </dialog>
</body>
</html>
